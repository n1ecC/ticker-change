name: Options Cache Warm and Sync

on:
  schedule:
    # Run hourly on weekdays during US market hours (14:15 to 22:15 UTC covers 9:15 AM to 6:15 PM ET)
    # Plus a final EOD run at 22:15 UTC (6:15 PM ET) to capture the final post-market closing options chain.
    - cron: '15 14-22 * * 1-5'
  workflow_dispatch:

jobs:
  warm-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance boto3 pandas

      - name: Run S3 Cache Warmer
        run: python warm_s3_cache.py
        env:
          S3_CACHE_BUCKET: ${{ secrets.S3_CACHE_BUCKET }}
          S3_CACHE_PREFIX: ${{ secrets.S3_CACHE_PREFIX }}
          S3_CACHE_REGION: ${{ secrets.S3_CACHE_REGION }}
          S3_CACHE_ENDPOINT_URL: ${{ secrets.S3_CACHE_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_URL: ${{ secrets.RENDER_APP_URL }}
          WARM_CACHE_TOKEN: ${{ secrets.WARM_CACHE_TOKEN }}
