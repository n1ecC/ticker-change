services:
  - type: web
    name: ticker-change
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 3 --bind 0.0.0.0:$PORT
    envVars:
      # --- Market-positioning data providers ---
      # Set these in the Render dashboard (sync: false = value is NOT read from
      # this file; Render stores it securely on its side).
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        value: ticker-change a.sun.079820@gmail.com

      # --- AI analyst report providers (any one is enough; tried in order) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # --- S3 option-chain cache (values set in the Render dashboard) ---
      - key: S3_CACHE_BUCKET
        sync: false
      - key: S3_CACHE_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # --- Runtime ---
      - key: PYTHON_VERSION
        value: 3.11.0
