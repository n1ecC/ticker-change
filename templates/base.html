<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Stock Price Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      body { font-family: 'Inter', sans-serif; }

      /* Tabular figures so numbers align in tables */
      .font-mono { font-variant-numeric: tabular-nums; }

      /* Animated border trail - @property for angle */
      @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      /* Animated border trail animation */
      @keyframes trail {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
      }

      /* Custom scrollbar for carousel */
      .carousel-scrollbar::-webkit-scrollbar {
        height: 10px;
      }
      .carousel-scrollbar::-webkit-scrollbar-track {
        background-color: #f4f4f5;
        border-radius: 5px;
      }
      .carousel-scrollbar::-webkit-scrollbar-thumb {
        background-color: #d4d4d8;
        border-radius: 5px;
      }
      .carousel-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #a1a1aa;
      }

      /* Dark mode scrollbar */
      .dark .carousel-scrollbar::-webkit-scrollbar-track {
        background-color: #18181b;
      }
      .dark .carousel-scrollbar::-webkit-scrollbar-thumb {
        background-color: #3f3f46;
      }
      .dark .carousel-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #52525b;
      }

      /* Firefox scrollbar */
      .carousel-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #d4d4d8 #f4f4f5;
      }
      .dark .carousel-scrollbar {
        scrollbar-color: #3f3f46 #18181b;
      }

      /* Scroll snap for carousel */
      .carousel-snap {
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
      }

      .carousel-item {
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      /* Shiny card hover effect (GitHub-style) */
      .shiny-card {
        position: relative;
        overflow: hidden;
      }

      .shiny-card-overlay {
        position: absolute;
        width: 16rem;
        height: 16rem;
        border-radius: 9999px;
        background: #fbbf24;
        opacity: 0;
        pointer-events: none;
        background-blend-mode: soft-light;
        filter: blur(3rem);
        transition: opacity 0.3s ease;
        transform: translate(var(--shiny-x, 0px), var(--shiny-y, 0px));
        z-index: 0;
      }

      .shiny-card:hover .shiny-card-overlay {
        opacity: 0.12;
      }

      .dark .shiny-card-overlay {
        opacity: 0;
      }

      .dark .shiny-card:hover .shiny-card-overlay {
        opacity: 0.08;
      }

      .shiny-card-content {
        position: relative;
        z-index: 1;
      }

      /* Animated border trail for carousel cards.
         The solid background-color acts as a static 1px border;
         the conic gradient sweeps an amber highlight over it. */
      .animated-border-trail {
        position: relative;
        overflow: hidden;
        border-radius: 0.75rem;
        padding: 1px;
        background-color: #e4e4e7;
        background-image: conic-gradient(from var(--angle) at 50% 50%, transparent 80%, rgba(245, 158, 11, 0.9));
        animation: trail 10s linear infinite;
      }

      .dark .animated-border-trail {
        background-color: #27272a;
      }

      .animated-border-trail > * {
        position: relative;
        border-radius: calc(0.75rem - 1px);
      }

      /* Make text colors brighter/white in dark mode for accessibility and high contrast */
      .dark body {
        color: #ffffff;
      }
      .dark .dark\:text-zinc-50 { color: #ffffff !important; }
      .dark .dark\:text-zinc-100 { color: #ffffff !important; }
      .dark .dark\:text-zinc-200 { color: #fafafa !important; }
      .dark .dark\:text-zinc-300 { color: #f4f4f5 !important; }
      .dark .dark\:text-zinc-400 { color: #e4e4e7 !important; }
      .dark .dark\:text-zinc-500 { color: #d4d4d8 !important; }
      .dark .dark\:text-zinc-600 { color: #a1a1aa !important; }
      .dark .dark\:text-zinc-700 { color: #71717a !important; }

      /* Muted utilities written without a dark: variant (e.g. plain text-zinc-400
         on descriptions/captions) — force them white in dark mode too. */
      .dark .text-zinc-300,
      .dark .text-zinc-400,
      .dark .text-zinc-500,
      .dark .text-zinc-600 { color: #ffffff !important; }
    </style>
    <script>
      // Initialize dark mode before page load to prevent flash
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen antialiased transition-colors duration-200">
    <nav class="bg-white dark:bg-zinc-950 border-b border-zinc-200 dark:border-zinc-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center gap-6">
            <a id="brand-link" href="/" class="inline-flex items-center gap-2.5 group">
              <svg class="w-4 h-4 text-amber-500" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <rect x="1" y="9" width="3" height="6" rx="1"/>
                <rect x="6.5" y="5" width="3" height="10" rx="1"/>
                <rect x="12" y="1" width="3" height="14" rx="1"/>
              </svg>
              <span class="text-lg font-semibold tracking-tight text-zinc-900 dark:text-zinc-50 group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">ticker<span class="text-amber-500">/</span>change</span>
            </a>
            <a id="nav-analytics" href="/analytics" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors font-medium">Analytics</a>
            <a id="nav-positioning" href="/positioning" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors font-medium">Positioning</a>
            <a id="nav-live" href="/live" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors font-medium">Live Microstructure</a>
            <a id="nav-momentum" href="/momentum" class="text-sm text-amber-500 dark:text-amber-400 hover:text-amber-600 dark:hover:text-amber-300 font-semibold transition-colors">Momentum Alpha</a>
            <a id="nav-ai-summary" href="/ai-summary" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors font-medium">AI Strategy</a>
            <a href="/glossary" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors font-medium">Glossary</a>
          </div>
          <div class="flex items-center gap-2">
            <a href="/settings" class="p-2 rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:border-zinc-300 dark:hover:border-zinc-700 transition-colors duration-200" title="API key settings" aria-label="Settings">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a6.759 6.759 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </a>
            <button id="theme-toggle" class="p-2 rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:border-zinc-300 dark:hover:border-zinc-700 transition-colors duration-200">
              <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
              </svg>
              <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-zinc-400 dark:text-zinc-600 pb-8 mt-12 space-y-1">
      <p class="text-xs uppercase tracking-wider">Powered by yfinance &middot; Real-time market data</p>
    </footer>

    <script>
      // Dark mode toggle functionality
      const themeToggleBtn = document.getElementById('theme-toggle');
      const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
      const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

      // Show the correct icon based on current theme
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        themeToggleLightIcon.classList.remove('hidden');
      } else {
        themeToggleDarkIcon.classList.remove('hidden');
      }

      themeToggleBtn.addEventListener('click', function() {
        // Toggle icons
        themeToggleDarkIcon.classList.toggle('hidden');
        themeToggleLightIcon.classList.toggle('hidden');

        // Toggle dark mode
        if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    </script>
    <script>
      // Persist the active ticker across Analytics / Positioning / Stock nav links.
      // Priority: URL param "ticker" > localStorage "last_ticker"
      (function () {
        const params = new URLSearchParams(window.location.search);
        const urlTicker = params.get('ticker');
        if (urlTicker) {
          localStorage.setItem('last_ticker', urlTicker.toUpperCase());
        }
        const ticker = urlTicker || localStorage.getItem('last_ticker');
        if (!ticker) return;

        const links = {
          'brand-link':      '/stock?ticker=' + ticker,
          'nav-analytics':   '/analytics?ticker=' + ticker,
          'nav-positioning': '/positioning?ticker=' + ticker,
          'nav-live':        '/live?ticker=' + ticker,
          'nav-ai-summary':  '/ai-summary?ticker=' + ticker,
        };
        Object.entries(links).forEach(([id, href]) => {
          const el = document.getElementById(id);
          if (el) el.href = href;
        });
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
