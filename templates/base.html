<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Stock Price Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#0f172a',
              secondary: '#1e293b',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body { font-family: 'Inter', sans-serif; }
      
      /* Animated border trail - @property for angle */
      @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      
      /* Animated border trail animation */
      @keyframes trail {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
      }
      
      /* Custom scrollbar for carousel */
      .carousel-scrollbar::-webkit-scrollbar {
        height: 10px;
      }
      .carousel-scrollbar::-webkit-scrollbar-track {
        background-color: #f1f5f9;
        border-radius: 5px;
      }
      .carousel-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 5px;
      }
      .carousel-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8;
      }
      
      /* Dark mode scrollbar */
      .dark .carousel-scrollbar::-webkit-scrollbar-track {
        background-color: #1e293b;
      }
      .dark .carousel-scrollbar::-webkit-scrollbar-thumb {
        background-color: #475569;
      }
      .dark .carousel-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #64748b;
      }
      
      /* Firefox scrollbar */
      .carousel-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 #f1f5f9;
      }
      .dark .carousel-scrollbar {
        scrollbar-color: #475569 #1e293b;
      }
      
      /* Scroll snap for carousel */
      .carousel-snap {
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
      }
      
      .carousel-item {
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      
      /* Animated border trail for carousel cards */
      .animated-border-trail {
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        padding: 1px;
        background: conic-gradient(from var(--angle) at 50% 50%, transparent 90%, white);
        animation: trail 10s linear infinite;
      }
      
      .animated-border-trail > * {
        position: relative;
        border-radius: 0.9375rem; /* 15px */
      }
    </style>
    <script>
      // Initialize dark mode before page load to prevent flash
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-800 min-h-screen transition-colors duration-200">
    <nav class="bg-gradient-to-r from-slate-900 to-slate-800 dark:from-slate-950 dark:to-slate-900 shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <a href="/" class="text-white text-xl font-bold tracking-tight hover:text-blue-400 transition">
              📈 ticker-change
            </a>
          </div>
          <div class="flex items-center">
            <button id="theme-toggle" class="p-2 rounded-lg bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 dark:hover:bg-slate-600 transition-colors duration-200">
              <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-yellow-300" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
              </svg>
              <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-slate-300" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-slate-500 dark:text-slate-400 pb-8 mt-12 space-y-1">
      <p class="text-sm">Powered by yfinance • Real-time market data</p>
      <p class="text-sm">Built with Cursor</p>
    </footer>

    <script>
      // Dark mode toggle functionality
      const themeToggleBtn = document.getElementById('theme-toggle');
      const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
      const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

      // Show the correct icon based on current theme
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        themeToggleLightIcon.classList.remove('hidden');
      } else {
        themeToggleDarkIcon.classList.remove('hidden');
      }

      themeToggleBtn.addEventListener('click', function() {
        // Toggle icons
        themeToggleDarkIcon.classList.toggle('hidden');
        themeToggleLightIcon.classList.toggle('hidden');

        // Toggle dark mode
        if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
