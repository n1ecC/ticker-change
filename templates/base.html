<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Stock Price Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      body { background-color: #f8f9fa; }
      .app-container { max-width: 1100px; margin: 32px auto; }
      .card-rounded { border-radius: 12px; }
      .positive { color: #198754; font-weight: 600; }
      .negative { color: #dc3545; font-weight: 600; }
      .na { color: #6c757d; }
      .search-input { max-width: 420px; }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Stock Tracker</a>
      </div>
    </nav>

    <main class="app-container">
      <div class="card card-body card-rounded shadow-sm">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="text-center text-muted mb-4 mt-3">
      <small>Powered by yfinance • Simple historical comparisons</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
